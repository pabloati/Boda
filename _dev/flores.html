<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de la web</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Flower editor: place, move and resize the botanical plates on the real page.
  Run `python3 _dev/serve.py` and open http://localhost:8000/_dev/flores.html
  The page below is index.html itself, so what you see is what guests see.
  "Guardar" writes js/flores-layout.js through the dev server; assets come from assets/flores/.
  Not published: GitHub Pages skips _dev/.
-->
<style>
  :root { --ink:#26261f; --soft:#6c6c60; --line:#d9d6cc; --bg:#eeece6; --panel:#fbfaf7; --acc:#c83c78; --accd:#a32a5e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* Side panels resize like VS Code's: drag the gutters, double-click to reset, drag to the edge to close. */
  body { --libW: 220px; --propW: 250px; font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); display: grid; grid-template-rows: 46px 1fr; grid-template-columns: var(--libW) 5px 1fr 5px var(--propW); grid-template-areas: "bar bar bar bar bar" "lib gl stage gr props"; }
  .gutter { background: var(--line); cursor: col-resize; position: relative; z-index: 3; touch-action: none; }
  .gutter::after { content: ''; position: absolute; inset: 0 -4px; }   /* wider grab area */
  .gutter:hover, .gutter.drag { background: var(--acc); }
  #gl { grid-area: gl; } #gr { grid-area: gr; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
  body.resizing #f { pointer-events: none; }   /* the iframe would swallow the pointer while dragging */
  .closed { display: none; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0 12px; }
  .tabs button { padding: 4px 9px; border-radius: 999px; font-size: .9em; } .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .bar-f { display: inline-flex; align-items: center; gap: 5px; color: var(--soft); } #branch { max-width: 170px; } #who { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; }
  textarea { width: 100%; min-height: 4.5em; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 5px; resize: vertical; background: #fff; }
  .t-item { display: block; width: 100%; text-align: left; margin-bottom: 3px; font-size: .92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-item.on { border-color: var(--acc); color: var(--accd); background: #fff4f8; } .t-item.mod::before { content: '● '; color: var(--acc); }
  .search { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 8px; }
  .sw-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; } .sw-row .hex { width: 5.6em; font: 11px monospace; padding: 3px 4px; border: 1px solid var(--line); border-radius: 4px; } .sw-row .hex.bad { border-color: #c33; color: #c33; }
  .pal-row { display: flex; gap: 3px; align-items: stretch; } .pal-row .preset { flex: 1; min-width: 0; } .pal-row .preset b { width: 9px; } .pal-row > button:not(.preset) { padding: 0 5px; margin-bottom: 5px; font-size: 12px; } .sw-row input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  .preset { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 5px; text-align: left; } .preset i { display: flex; gap: 2px; } .preset b { width: 12px; height: 18px; border-radius: 2px; }
  .preset.on { border-color: var(--acc); }
  .font-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; width: 100%; margin-bottom: 4px; text-align: left; padding: 4px 9px; }
  .font-row span { font-size: 19px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .font-row em { font: normal 10px system-ui, sans-serif; color: var(--soft); flex: none; }
  .font-row.on { border-color: var(--acc); background: #fff4f8; color: var(--accd); }
  .ph-slot { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 12px; background: #fff; }
  .ph-slot img { width: 100%; max-height: 160px; object-fit: contain; background: #eee; border-radius: 4px; display: block; margin-bottom: 6px; }
.fake-btn { display: inline-block; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .ph-slot.drop { border-color: var(--acc); background: #fdf0f6; }
  .sec-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; background: #fff; cursor: grab; }
  .sec-row.off { opacity: .5; } .sec-row.over { border-color: var(--acc); } .sec-row span { flex: 1; } .sec-row button { padding: 1px 7px; }
  .sec-opts { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: .88em; color: var(--soft); cursor: default; }
  .sec-opts label { display: inline-flex; align-items: center; gap: 3px; } .sec-opts [data-rs] { margin-left: auto; } .sec-opts select { font-size: inherit; padding: 1px 2px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  button.panel-t.on { background: #fff; color: var(--ink); border-color: var(--line); } button.panel-t:not(.on) { color: var(--soft); background: transparent; text-decoration: line-through; }
  #bar { grid-area: bar; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar h1 { font-size: 14px; margin: 0 8px 0 0; white-space: nowrap; }
  #bar { overflow-x: auto; } #bar > * { flex: none; } #bar label, #bar button { white-space: nowrap; }
  #bar .sp { flex: 1; }
  #bar .grp.panels { margin-left: 4px; }
  button, select, input[type=number] { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: #b9b5a8; } button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; } button.primary:hover { background: var(--accd); }
  button.danger { color: #a22; }
  .grp { display: flex; gap: 0; } .grp button { border-radius: 0; margin-left: -1px; } .grp button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; } .grp button:last-child { border-radius: 0 6px 6px 0; }
  #status { color: var(--soft); min-width: 170px; text-align: right; } #status.dirty { color: var(--accd); font-weight: 600; }
  /* panel contents scale with the panel: text a little, thumbnails and columns a lot */
  aside { background: var(--panel); overflow: auto; padding: 12px; container-type: inline-size; }
  aside > * { font-size: clamp(12.5px, 5.2cqw, 16px); }   /* cqw = the panel's width (a container cannot size itself) */
  #lib { grid-area: lib; border-right: 1px solid var(--line); }
  #props { grid-area: props; border-left: 1px solid var(--line); }
  aside h2 { font-size: clamp(10.5px, 4cqw, 13px); text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 0 0 8px; }
  #libGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(92px, 29cqw), 1fr)); gap: 8px; }   /* thumbnails grow with the panel, columns come and go */
  .th { border: 1px solid var(--line); border-radius: 6px; background: #f3eee3; padding: 4px; cursor: pointer; text-align: center; }
  .th:hover { border-color: var(--acc); }
  .th .im { aspect-ratio: 1 / 0.95; display: flex; align-items: flex-end; justify-content: center; } .th img { max-width: 100%; max-height: 100%; }
  .th span { display: block; font-size: .85em; margin-top: 3px; }
  #stage { grid-area: stage; overflow: auto; padding: 14px; display: flex; justify-content: center; align-items: flex-start; }
  #wrap { background: #fff; box-shadow: 0 2px 18px rgba(0,0,0,.18); flex: none; overflow: hidden; border-radius: 4px; }
  #f { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .row label { width: 6.2em; color: var(--soft); flex: none; }
  .row input[type=number], .row select { width: 100%; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .placed { display: grid; gap: 3px; max-height: 260px; overflow-y: auto; }
  .pl-sec { font: 600 10px monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--soft); margin-top: 6px; }
  .pl { display: flex; justify-content: space-between; gap: 8px; text-align: left; }
  .pl span { color: var(--soft); font-size: 11px; } .pl.on { border-color: #c83c78; color: #c83c78; } .pl em { font-style: normal; font-size: 10px; color: var(--soft); }
  .pl-lay { font-size: 10px; color: var(--soft); margin: 2px 0 0 2px; font-style: italic; }
  .grp2 { display: flex; margin-bottom: 8px; } .grp2 button { flex: 1; border-radius: 0; margin-left: -1px; } .grp2 button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; } .grp2 button:last-child { border-radius: 0 6px 6px 0; }
  .row input[type=range] { flex: 1; min-width: 0; } .val { width: 38px; text-align: right; color: var(--soft); }
  .note.own { background: #eaf3ea; border-color: #b8d4b8; } .note button { margin-top: 6px; }
  button:disabled { opacity: .45; cursor: default; }
  .note { background: #fff4d6; border: 1px solid #ecd48a; border-radius: 6px; padding: 7px 9px; margin: 8px 0; }
  .hint { color: var(--soft); } .hint p { margin: 0 0 8px; } kbd { background: #fff; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 11px monospace; }
  #banners { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .bn { display: none; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; gap: 10px; align-items: center; pointer-events: auto; max-width: 70vw; }
  .bn.show { display: flex; } .bn button { padding: 3px 9px; color: var(--ink); }
  /* Historial tab */
  .h-row { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin-bottom: 5px; background: #fff; font-size: .92em; }
  .h-row.ed { border-left: 3px solid var(--acc); } .h-row.on { border-color: var(--acc); background: #fff4f8; }
  .h-top { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; color: var(--soft); font-size: .9em; } .h-top code { color: var(--ink); }
  .h-tag { font: 600 9px monospace; text-transform: uppercase; background: var(--acc); color: #fff; border-radius: 3px; padding: 0 4px; }
  .h-tag.now { background: var(--ink); }
  .h-sub { margin: 2px 0; overflow-wrap: anywhere; } .h-files { color: var(--soft); font: 10px monospace; overflow-wrap: anywhere; }
  .h-row button { margin-top: 4px; padding: 2px 8px; font-size: .9em; }
  /* "Ver en mi móvil": link + QR popover under the bar; "Publicar": confirmation in the right panel */
  #sharePop { position: fixed; z-index: 20; width: 300px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.22); padding: 14px; }
  #sharePop h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 0 0 8px; }
  #sharePop .qr svg { display: block; width: 220px; height: 220px; margin: 0 auto 8px; }
  #sharePop .hint { margin: 0 0 8px; } #sharePop .btns { margin-bottom: 8px; }
  .share-url { font: 11px/1.4 monospace; word-break: break-all; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; margin-bottom: 8px; }
  .share-url a { color: var(--accd); }
  .note.warn { background: #fde8ee; border-color: #eaa9bd; }
  .pub-list { display: grid; gap: 4px; max-height: 45vh; overflow-y: auto; margin-bottom: 10px; }
  .pub-c { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 5px 7px; font-size: .92em; }
  .pub-c code { font: 11px monospace; color: var(--accd); } .pub-c span { color: var(--soft); } .pub-c div { margin-top: 2px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header id="bar">
  <h1>Editor de la web</h1>
  <div class="grp"><button id="devM" class="on">Móvil</button><button id="devD">Escritorio</button></div>
  <select id="goto" title="Ir a una sección"></select>
  <label><input type="checkbox" id="guides" checked> Ver secciones</label>
  <div class="grp"><button id="undo" title="Ctrl+Z">Deshacer</button><button id="redo" title="Ctrl+Mayús+Z">Rehacer</button></div>
  <button id="reload" title="Vuelve a cargar la web, conserva las flores">Recargar web</button>
  <div class="grp panels"><button id="tLib" class="panel-t on" title="Mostrar u ocultar la biblioteca">Flores</button><button id="tProps" class="panel-t on" title="Mostrar u ocultar las propiedades">Propiedades</button></div>
  <span class="sp"></span>
  <label class="bar-f" title="Rama de git en la que se guardan los cambios">Rama <select id="branch"></select></label>
  <input id="who" class="bar-f" placeholder="Tu nombre" title="Aparece en el commit" size="9">
  <label class="bar-f" title="Después de guardar, sube la rama a GitHub"><input type="checkbox" id="push" checked> Subir</label>
  <span id="status">Sin cambios</span>
  <button id="save" class="primary" title="Ctrl+S">Guardar</button>
  <button id="share" title="Enlace y código QR de esta rama, para abrirla en el móvil">Ver en mi móvil</button>
  <button id="publish" title="Une esta rama a main: cambia la web que ven los invitados">Publicar</button>
</header>
<div class="gutter" id="gl" title="Arrastra para cambiar el ancho · doble clic: ancho inicial"></div>
<aside id="lib">
  <nav class="tabs" id="tabs"><button data-tab="flores" class="on">Flores</button><button data-tab="textos">Textos</button><button data-tab="colores">Colores</button><button data-tab="fuentes">Fuentes</button><button data-tab="fotos">Fotos</button><button data-tab="secciones">Secciones</button><button data-tab="historial">Historial</button></nav>
  <section class="tab" id="tab-flores"><h2>Flores</h2><div id="libGrid"></div>
    <p class="hint" style="margin-top:12px">Haz clic en una flor para añadirla a la sección que estás viendo.</p></section>
  <section class="tab" id="tab-textos" hidden></section>
  <section class="tab" id="tab-colores" hidden></section>
  <section class="tab" id="tab-fuentes" hidden></section>
  <section class="tab" id="tab-fotos" hidden></section>
  <section class="tab" id="tab-secciones" hidden></section>
  <section class="tab" id="tab-historial" hidden></section>
</aside>
<main id="stage"><div id="wrap"><iframe id="f" title="Web"></iframe></div></main>
<div class="gutter" id="gr" title="Arrastra para cambiar el ancho · doble clic: ancho inicial"></div>
<aside id="props"></aside>
<div id="banners">
  <div id="banner" class="bn"><span>Hay un borrador sin guardar de otra sesión.</span><button id="bRestore">Recuperar</button><button id="bDrop">Descartar</button></div>
  <div id="remote" class="bn"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const SECS = ['intro', 'countdown', 'locations', 'timeline', 'rsvp', 'gifts', 'playlist', 'social', 'footer'];
  const SNAP = 6;
  let DRAFT = 'flores-draft';
  let pendingDraft = null;   // a flower draft from another session, until the banner (editor-site.js) restores or drops it
  const frame = $('f');
  let LIB = [], items = [], sel = null, win = null, doc = null, dev = 'm', saved = '[]';
  let BASE = '/', MODE = 'flores', FLORES_OK = false;   // BASE: URL prefix of the branch's worktree
  let undoSt = [], redoSt = [];
  let clip = null, fmt = null;   // Ctrl+C copies a plate; Ctrl+Mayús+C copies its size and turn
  let multi = new Set();         // Mayús+clic: several plates selected; sel is the last one clicked
  let tpos = {}, tsel = null;    // moved texts: key → { x, y, z, size?, color?, align?, font?, d? } (saved by the site module in the look); the selected text's key
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const clone = o => JSON.parse(JSON.stringify(o));
  const lib = id => LIB.find(l => l.id === id);
  const get = id => items.find(i => i.id === id);
  const r1 = v => Math.round(v * 2) / 2;

  // ---------- model ↔ geometry ----------
  const secEl = key => win.Flores.host(doc, key);
  // Placement = w, x, y, rot. The phone one lives on the item; in the "Escritorio" view a plate can
  // have its own (it.d), created the first time it is moved, resized or turned there.
  const DESK = () => dev === 'd';
  const view = it => DESK() && it.d ? it.d : it;
  function ed(it) {
    if (!DESK()) return it;
    if (!it.d) it.d = { w: it.w, x: clone(it.x), y: clone(it.y), rot: it.rot || 0 };
    return it.d;
  }
  function geom(it) {
    const v = view(it), el = secEl(it.sec), l = lib(it.img), w = v.w, h = w * l.h / l.w;
    const sw = el.offsetWidth, sh = el.offsetHeight;
    return { w, h, sw, sh, rot: v.rot || 0,
      left: v.x.a === 'l' ? v.x.v : sw - v.x.v - w,
      top: v.y.a === 't' ? v.y.v : sh - v.y.v - h };
  }
  // Anchors to the nearest edge, so a plate flush with an edge stays flush at any width.
  function setPos(it, left, top, target) {
    const g = geom(it), p = target || ed(it);
    p.x = (left + g.w / 2) < g.sw / 2 ? { a: 'l', v: r1(left) } : { a: 'r', v: r1(g.sw - left - g.w) };
    p.y = (top + g.h / 2) < g.sh / 2 ? { a: 't', v: r1(top) } : { a: 'b', v: r1(g.sh - top - g.h) };
  }

  // ---------- history / persistence ----------
  const state = () => JSON.stringify({ i: items, t: tpos });
  function restore(js) { const o = JSON.parse(js); items = o.i; tpos = o.t || {}; if (!get(sel)) sel = null; }
  function snapshot() { undoSt.push(state()); if (undoSt.length > 100) undoSt.shift(); redoSt = []; }
  function changed() {
    if (!pendingDraft) try { localStorage.setItem(DRAFT, JSON.stringify(items)); } catch (e) {}
    if (window.SITE) { window.SITE.textChanged(); window.SITE.status(); }
    $('undo').disabled = !undoSt.length; $('redo').disabled = !redoSt.length;
    renderAll();
  }
  function undo() { if (!undoSt.length) return; redoSt.push(state()); restore(undoSt.pop()); changed(); }
  function redo() { if (!redoSt.length) return; undoSt.push(state()); restore(redoSt.pop()); changed(); }
  function save() { if (window.SITE) window.SITE.save(); }
  // after a successful save of everything
  function markSaved() { saved = JSON.stringify(items); try { localStorage.removeItem(DRAFT); } catch (e) {} changed(); }

  // ---------- rendering inside the page ----------
  const EDIT_CSS = `
    #envelope-overlay { display: none !important; }
    .ed-sec { position: relative; overflow: hidden; isolation: isolate; }
    .ed-guides .ed-sec { outline: 1px dashed rgba(200,60,120,.6); outline-offset: -1px; }
    .ed-label { position: absolute; top: 3px; right: 4px; z-index: 70; font: 10px monospace; background: rgba(200,60,120,.88); color: #fff; padding: 1px 6px; border-radius: 3px; pointer-events: none; display: none; }
    .ed-guides .ed-label { display: block; }
    #ed-box { position: absolute; border: 1.5px solid #c83c78; z-index: 60; pointer-events: none; }
    .ed-h { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid #c83c78; border-radius: 2px; pointer-events: auto; z-index: 61; }
    .ed-h[data-c=nw] { left: -6px; top: -6px; cursor: nwse-resize; } .ed-h[data-c=ne] { right: -6px; top: -6px; cursor: nesw-resize; }
    .ed-h[data-c=sw] { left: -6px; bottom: -6px; cursor: nesw-resize; } .ed-h[data-c=se] { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .ed-rot { position: absolute; left: 50%; top: -30px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: #fff; border: 1.5px solid #c83c78; cursor: grab; pointer-events: auto; z-index: 61; }
    .ed-rot::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 15px; margin-left: -.75px; background: #c83c78; }
    #ed-box.many { border-style: dashed; }
    #ed-box.text { border-color: #3a7bd5; }
    .ed-mode-flores .ed-tmove:hover { outline: 1px dashed rgba(58,123,213,.65); outline-offset: 2px; cursor: move; }
    #ed-box.locked { border-style: dotted; border-color: #8a8577; }
    .ed-lock { position: absolute; left: 0; top: -17px; font: 10px monospace; background: #8a8577; color: #fff; padding: 1px 5px; border-radius: 3px; }
    .ed-g { position: absolute; background: #e8358a; z-index: 65; pointer-events: none; }
    .ed-g.v { width: 1px; top: 0; bottom: 0; } .ed-g.h { height: 1px; left: 0; right: 0; }
  `;
  function renderAll() {
    if (!win || !win.Flores || !doc) return;
    win.Flores.render(doc, items);
    doc.querySelectorAll('.flor').forEach(img => { const it = get(img.dataset.id); if (it) img.style.height = (geom(it).h) + 'px'; });
    drawSel(); drawProps();
  }
  const selected = () => (multi.size > 1 ? [...multi].map(get) : [get(sel)]).filter(Boolean);
  function drawSel() {
    doc.querySelectorAll('#ed-box').forEach(b => b.remove());
    const list = selected(), one = list.length === 1;
    list.forEach(it => {
      const g = geom(it), box = doc.createElement('div');
      box.id = 'ed-box'; if (!one) box.classList.add('many'); if (it.lock) box.classList.add('locked');

      if (rh) { e.preventDefault(); startRotate(e, get(sel)); }

      else if (useText) { e.preventDefault(); selectText(textKey(te)); startTextDrag(e, te); }
      else if (t && e.shiftKey) { e.preventDefault(); toggleSel(t.id); }
      else if (t && multi.size > 1 && multi.has(t.id)) { e.preventDefault(); sel = t.id; drawProps(); startGroupDrag(e, t); }
      else if (t) { e.preventDefault(); select(t.id); startDrag(e, t); }
      else select(null);
    });
    doc.addEventListener('pointermove', e => { if (MODE === 'flores' && !e.buttons) { const t = hit(e.pageX, e.pageY), te = textAt(e.target); doc.documentElement.style.cursor = t ? (t.lock && !te ? 'default' : 'move') : ''; } });
    renderAll(); changed();
    if (window.SITE) window.SITE.offerDraft();
  }
  const load = {};

  function onKey(e) {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    const mod = e.ctrlKey || e.metaKey, it = get(sel);
    if (mod && e.key.toLowerCase() === 'z' && MODE === 'flores') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === 'y' && MODE === 'flores') { e.preventDefault(); redo(); }
    else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if (mod && !e.shiftKey && e.key.toLowerCase() === 'v' && MODE === 'flores') { e.preventDefault(); paste(); }
    else if (tsel && !it && MODE === 'flores') {
      if (e.key === 'Escape') select(null);
      else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); treset(tsel); }
      else if (e.key.startsWith('Arrow')) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; tnudge(tsel, e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0); }
    }
    else if (!it || MODE !== 'flores') return;
    else if (mod && e.key.toLowerCase() === 'c') { e.preventDefault(); if (e.shiftKey) { copyFmt(it); drawProps(); } else copy(it); }
    else if (mod && e.shiftKey && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteFmt(it); }
    else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); dup(it); }
    else if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); const l = selected(); setLock(l, !l.every(o => o.lock)); }
    else if (mod && (e.key === ']' || e.key === '}' || e.code === 'BracketRight')) { e.preventDefault(); restack(it, e.shiftKey ? 'top' : 'up'); }
    else if (mod && (e.key === '[' || e.key === '{' || e.code === 'BracketLeft')) { e.preventDefault(); restack(it, e.shiftKey ? 'bottom' : 'down'); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(it); }
    else if (e.key === 'Escape') select(null);
    else if (e.key.startsWith('Arrow')) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; nudge(it, e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0); }
  }

  // ---------- boot ----------
  $('devM').onclick = () => setDev('m'); $('devD').onclick = () => setDev('d');
  $('undo').onclick = undo; $('redo').onclick = redo; $('save').onclick = save;
  $('reload').onclick = () => frame.contentWindow.location.reload();
  $('guides').onchange = e => doc && doc.documentElement.classList.toggle('ed-guides', e.target.checked);
  $('goto').onchange = e => { const s = e.target.value && secEl(e.target.value); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); e.target.value = ''; };
  window.addEventListener('resize', fit);

  // ---------- resizable side panels ----------
  const PANELS = { lib: { v: '--libW', def: 220, g: 'gl', t: 'tLib', side: 'l' }, props: { v: '--propW', def: 250, g: 'gr', t: 'tProps', side: 'r' } };
  const MIN = 160, CLOSE = 90;
  let widths = { lib: 220, props: 250, libOpen: true, propsOpen: true };
  try { Object.assign(widths, JSON.parse(localStorage.getItem('flores-panels') || '{}')); } catch (e) {}
  let refit = 0;
  function applyPanels() {
    Object.entries(PANELS).forEach(([k, P]) => {
      const open = widths[k + 'Open'];
      document.body.style.setProperty(P.v, open ? widths[k] + 'px' : '0px');
      $(k).classList.toggle('closed', !open); $(P.t).classList.toggle('on', open);
    });
    try { localStorage.setItem('flores-panels', JSON.stringify(widths)); } catch (e) {}
    cancelAnimationFrame(refit); refit = requestAnimationFrame(fit);
  }
  Object.entries(PANELS).forEach(([k, P]) => {
    const g = $(P.g);
    g.addEventListener('pointerdown', e => {
      e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag'); document.body.classList.add('resizing');
      const startW = widths[k + 'Open'] ? widths[k] : P.def;   // closing keeps this width for when it reopens
      const move = ev => {
        const w = P.side === 'l' ? ev.clientX : window.innerWidth - ev.clientX, max = Math.round(window.innerWidth * 0.45);
        if (w < CLOSE) { widths[k + 'Open'] = false; widths[k] = startW; }
        else { widths[k + 'Open'] = true; widths[k] = Math.min(max, Math.max(MIN, Math.round(w))); }
        applyPanels();
      };
      const up = () => { g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.classList.remove('drag'); document.body.classList.remove('resizing'); fit(); };
      g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
    });
    g.addEventListener('dblclick', () => { widths[k] = P.def; widths[k + 'Open'] = true; applyPanels(); });
    $(P.t).onclick = () => { widths[k + 'Open'] = !widths[k + 'Open']; applyPanels(); };
  });
  applyPanels();
  window.addEventListener('keydown', onKey);
  window.addEventListener('beforeunload', e => { if (JSON.stringify(items) !== saved) { e.preventDefault(); e.returnValue = ''; } });
  frame.addEventListener('load', onLoad);
  // ---------- hooks for the site module (_dev/editor-site.js) ----------
  window.ED = {
    // load a branch: BASE is the URL of its worktree; flower state starts from its layout
    open(base, branch) {
      BASE = base; DRAFT = 'flores-draft:' + branch; pendingDraft = null; items = []; saved = '[]'; sel = null; tsel = null; tpos = {}; multi = new Set(); undoSt = []; redoSt = []; load.done = false; FLORES_OK = false;
      LIB = []; $('libGrid').innerHTML = '';
      fetch(BASE + 'assets/flores/flores.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(l => { LIB = l; if (LIB.length) buildLib(); drawProps(); }).catch(() => {});
      frame.src = BASE + 'index.html';
    },
    reloadFrame() { if (frame.contentWindow) frame.contentWindow.location.reload(); },
    setMode(m) { MODE = m; sel = null; tsel = null; multi = new Set(); if (doc) { drawSel(); doc.documentElement.classList.toggle('ed-guides', m === 'flores' && $('guides').checked); doc.documentElement.classList.toggle('ed-mode-flores', m === 'flores'); } drawProps(); },
    // moved texts: the site module keeps them in the look (saved into css/editor.css) and hands them over when a branch opens
    textPos: () => clone(tpos),
    setTextPos(t) { tpos = clone(t || {}); tsel = null; },
    floresDirty: () => FLORES_OK && JSON.stringify(items) !== saved,
    floresItems: () => clone(items),
    markSaved, fit, renderAll, drawProps,
    openProps() { if (!widths.propsOpen) { widths.propsOpen = true; applyPanels(); } },
    // the flower draft left by another session (JSON) or null; restore or drop it (one banner for all drafts)
    floresDraft: () => pendingDraft,
    restoreFloresDraft() { if (!pendingDraft) return; const d = pendingDraft; pendingDraft = null; items = JSON.parse(d); changed(); },
    dropFloresDraft() { pendingDraft = null; try { localStorage.removeItem(DRAFT); } catch (e) {} },
    get doc() { return doc; }, get win() { return win; }, get dev() { return dev; }, get base() { return BASE; },
  };
})();
</script>
<script src="/_dev/qr.js"></script>
<script src="/_dev/editor-site.js"></script>
</body>
